# Continuous integration: runs every check on each pull request and on main.
# If any step fails, the PR shows a red X. With branch protection on,
# that blocks the merge until it's fixed.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test and package (macOS)
    # macOS is required: the E2E tests open a real window and we package a .app.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to exact commits (the tag is in the comment), so a
      # compromised or moved tag can't change what runs here.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json records, and fails if it's out of date.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: End-to-end tests (built app)
        run: npm run test:e2e

      - name: Package macOS app (unsigned)
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test packaged app
        run: npm run test:packaged
